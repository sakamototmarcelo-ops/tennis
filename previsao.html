<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1520">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>Previsão do Tempo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout: full-bleed mobile cards, sticky header, horizontal hourly strip */
:root {
  --bg:#0c1520; --surf:#131d2b; --card:#192638; --bdr:#1f3348;
  --txt:#ddeeff; --dim:#6a8dac; --lbl:#8aafc8;
  --blu:#3b9eff; --cyn:#0dd4ff; --grn:#22c55e; --amb:#f59e0b; --red:#ef4444;
  color-scheme: dark;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#edf4fb; --surf:#fff; --card:#fff; --bdr:#cddae8;
    --txt:#0c1826; --dim:#4e7a9c; --lbl:#3a6a8a;
    color-scheme:light;
  }
}
:root[data-theme="dark"]{ color-scheme:dark; }
:root[data-theme="light"]{
  --bg:#edf4fb; --surf:#fff; --card:#fff; --bdr:#cddae8;
  --txt:#0c1826; --dim:#4e7a9c; --lbl:#3a6a8a;
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}

/* header */
header{
  position:sticky;top:env(safe-area-inset-top,0px);
  background:var(--surf);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:10px;padding:11px 16px;z-index:20;
}
.loc-wrap{flex:1;min-width:0}
.loc-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-sub{font-size:11px;color:var(--dim);margin-top:1px}
.ico-btn{
  width:36px;height:36px;border-radius:50%;
  background:var(--card);border:1px solid var(--bdr);
  color:var(--txt);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* search overlay */
#search-ov{
  position:fixed;inset:0;background:var(--bg);z-index:50;
  padding:12px 16px;display:flex;flex-direction:column;gap:10px;
  overflow-y:auto;
}
.srch-row{display:flex;gap:8px;align-items:center}
#srch-inp{
  flex:1;height:44px;border-radius:10px;border:1.5px solid var(--bdr);
  background:var(--card);color:var(--txt);padding:0 14px;
  font-size:16px;font-family:inherit;outline:none;
}
#srch-inp:focus{border-color:var(--blu)}
.srch-cancel{background:none;border:none;color:var(--blu);font-size:13px;cursor:pointer;padding:8px 4px;font-family:inherit;white-space:nowrap}
.sr-item{padding:11px 14px;border-radius:10px;background:var(--card);border:1px solid var(--bdr);cursor:pointer}
.sr-item:active{opacity:.7}
.sr-name{font-size:14px;font-weight:600}
.sr-sub{font-size:11px;color:var(--dim);margin-top:2px}

/* states */
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;color:var(--dim)}
.spin{width:38px;height:38px;border:3px solid var(--bdr);border-top-color:var(--blu);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.retry-btn{margin-top:8px;padding:10px 24px;border-radius:10px;background:var(--blu);color:#fff;border:none;font-size:14px;cursor:pointer;font-family:inherit}

/* sections */
.sec{padding:16px 16px 0}
.sec-ttl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lbl);margin-bottom:10px}

/* current card */
.cur-card{
  background:var(--card);border:1px solid var(--bdr);border-radius:16px;
  padding:20px;
}
.cur-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cur-temp{font-family:'Barlow Condensed',sans-serif;font-size:80px;font-weight:800;line-height:.9;letter-spacing:-.02em}
.cur-icon{font-size:58px;line-height:1}
.cur-desc{font-size:16px;font-weight:500;color:var(--dim);margin-top:8px}
.cur-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--bg);border:1px solid var(--bdr);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px}
.chip b{color:var(--txt)}

/* alert */
.alert{
  border-radius:12px;padding:10px 14px;margin-top:12px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(90deg,#7c2d1220,#f59e0b18);
  border:1px solid #f59e0b44;
}
.alert-ico{font-size:20px}
.alert-txt{font-size:13px;font-weight:600;color:var(--amb)}

/* hourly strip */
.h-strip{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.h-strip::-webkit-scrollbar{display:none}
.h-item{
  flex-shrink:0;width:56px;background:var(--card);border:1px solid var(--bdr);
  border-radius:12px;padding:9px 5px;display:flex;flex-direction:column;
  align-items:center;gap:4px;
}
.h-item.now{border-color:var(--blu);background:var(--card);box-shadow:0 0 0 1px var(--blu),0 0 14px rgba(59,158,255,.12)}
.h-time{font-size:10px;color:var(--dim);font-weight:600}
.h-ico{font-size:22px;line-height:1}
.h-temp{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700}
.h-pop{font-size:10px;font-weight:600;color:var(--dim)}
.h-pop.wet{color:var(--cyn)}

/* daily */
.day-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.day-card{
  background:var(--card);border:1px solid var(--bdr);border-radius:14px;
  padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;
}
.day-name{font-size:11px;font-weight:700;color:var(--lbl);text-transform:uppercase;letter-spacing:.06em}
.day-ico{font-size:30px;line-height:1}
.day-max{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800}
.day-min{font-size:13px;color:var(--dim)}
.day-rain{font-size:11px;font-weight:600;color:var(--blu)}
.day-rain.dry{color:var(--dim)}

/* consensus */
.con-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px;overflow:hidden}
.con-tabs{display:flex;gap:6px;margin-bottom:10px}
.con-tab{flex:1;padding:6px 10px;border-radius:8px;border:1px solid var(--bdr);background:var(--bg);color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.con-tab.active{background:var(--blu);border-color:var(--blu);color:#fff}
.con-legend{display:flex;gap:16px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.leg-bar{width:22px;height:3px;border-radius:2px}
.con-info{margin-top:8px;font-size:11px;color:var(--dim);text-align:center;line-height:1.5}
.ct{font-size:10px;fill:var(--dim);font-family:'Inter',sans-serif}

/* radar */
.radar-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;overflow:hidden}
#radar-map{position:relative;z-index:0;height:300px;width:100%;background:var(--bg)}
.radar-bar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.radar-bar button{width:36px;height:36px;border-radius:50%;border:1px solid var(--bdr);background:var(--bg);color:var(--txt);font-size:14px;cursor:pointer;flex-shrink:0}
.radar-bar input{flex:1;min-width:0}
#radar-time{font-size:12px;font-weight:600;color:var(--dim);min-width:92px;text-align:right}
.radar-note{padding:0 12px 10px;font-size:11px;color:var(--dim);line-height:1.5}
.radar-note a{color:var(--blu);text-decoration:none}

/* tabelas do consenso */
.tbl-ttl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lbl);margin:14px 0 6px}
.tbl-ttl:first-child{margin-top:0}
.tbl-wrap{overflow-x:auto}
.ctbl{width:100%;border-collapse:collapse;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.ctbl th{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--lbl);padding:6px 3px;border-bottom:1px solid var(--bdr)}
.ctbl td{padding:7px 3px;border-bottom:1px solid var(--bdr)}
.ctbl th:first-child,.ctbl td:first-child{text-align:left;color:var(--dim);font-weight:600;padding-left:4px;white-space:nowrap}
.ctbl th.e{color:var(--blu)} .ctbl th.g{color:var(--grn)} .ctbl th.i{color:var(--amb)}
.ctbl tr.dsep td{background:var(--bg);color:var(--lbl);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:5px 6px}
.ctbl .ok{color:var(--grn);font-weight:600} .ctbl .mid{color:var(--amb);font-weight:600} .ctbl .bad{color:var(--red);font-weight:600}
.ctbl td.wet{color:var(--cyn);font-weight:600}
.con-empty{padding:18px 6px;text-align:center;font-size:13px;color:var(--dim)}

/* footer */
footer{padding:20px 16px 0;font-size:11px;color:var(--dim);text-align:center;line-height:1.7}
footer a{color:var(--blu);text-decoration:none}
</style>

</head>
<body>
<header>
  <div class="loc-wrap">
    <div class="loc-name" id="loc-name">Obtendo localização…</div>
    <div class="loc-sub" id="loc-sub"></div>
  </div>
  <button class="ico-btn" id="btn-srch" title="Buscar cidade">🔍</button>
  <button class="ico-btn" id="btn-gps"  title="Usar minha localização">📍</button>
</header>

<div id="search-ov" hidden>
  <div class="srch-row">
    <input id="srch-inp" type="text" placeholder="Digite uma cidade…" autocomplete="off" autocorrect="off">
    <button class="srch-cancel" id="btn-srch-cancel">Cancelar</button>
  </div>
  <div id="srch-results"></div>
</div>

<div id="loading">
  <div class="spin"></div>
  <div>Carregando previsão…</div>
</div>

<div id="err-msg" hidden style="padding:40px 16px;text-align:center;color:var(--dim)">
  <div style="font-size:44px;margin-bottom:14px">🌩️</div>
  <div id="err-txt" style="font-size:14px">Não foi possível carregar a previsão.</div>
  <button class="retry-btn" onclick="retryLoad()">Tentar novamente</button>
</div>

<div id="content" hidden>

  <div class="sec" style="padding-top:16px">
    <div class="cur-card">
      <div class="cur-top">
        <div class="cur-temp" id="cur-temp">--°</div>
        <div class="cur-icon" id="cur-icon">⛅</div>
      </div>
      <div class="cur-desc" id="cur-desc">--</div>
      <div class="cur-chips" id="cur-chips"></div>
    </div>
    <div id="alert-box" class="alert" hidden>
      <span class="alert-ico" id="alert-ico">🌧️</span>
      <span class="alert-txt" id="alert-txt"></span>
    </div>
  </div>

  <div class="sec" style="padding-top:20px">
    <div class="sec-ttl">Próximas 24 horas</div>
    <div class="h-strip" id="h-strip"></div>
  </div>

  <div class="sec" style="padding-top:20px">
    <div class="sec-ttl">Próximos dias</div>
    <div class="day-grid" id="day-grid"></div>
  </div>

  <div class="sec" style="padding-top:20px">
    <div class="sec-ttl">Consenso de modelos · 48h</div>
    <div class="con-card">
      <div class="con-tabs">
        <button class="con-tab active" id="tab-temp" onclick="switchConTab('temp')">🌡️ Temperatura</button>
        <button class="con-tab" id="tab-rain" onclick="switchConTab('rain')">🌧️ Chuva (mm)</button>
      </div>
      <div id="con-tbl"></div>
      <div class="con-info" id="con-info"></div>
    </div>
  </div>

  <div class="sec" style="padding-top:20px">
    <div class="sec-ttl">Radar de chuva · últimas 2h</div>
    <div class="radar-card">
      <div id="radar-map"></div>
      <div class="radar-bar">
        <button id="radar-play" aria-label="Reproduzir">▶</button>
        <input type="range" id="radar-slider" min="0" max="0" value="0">
        <span id="radar-time">--:--</span>
      </div>
      <div class="radar-note" id="radar-note"></div>
    </div>
  </div>

  <footer>
    Fonte: <a href="https://open-meteo.com" target="_blank">Open-Meteo</a> · Modelos: ECMWF IFS, GFS (NOAA), ICON (DWD)<br>
    <span id="ft-updated"></span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── WMO helpers ────────────────────────────────────────────────────
const DAYS_PT  = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS_PT= ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function wmoIcon(c, day=1){
  if(c===0)  return day?'☀️':'🌙';
  if(c<=1)   return day?'🌤️':'🌙';
  if(c<=2)   return '⛅';
  if(c<=3)   return '☁️';
  if(c<=48)  return '🌫️';
  if(c<=55)  return '🌦️';
  if(c<=67)  return '🌧️';
  if(c<=77)  return '❄️';
  if(c<=82)  return '🌦️';
  if(c<=86)  return '🌨️';
  return '⛈️';
}
function wmoDesc(c, day=1){
  if(c===0)  return day?'Céu limpo':'Noite clara';
  if(c===1)  return 'Principalmente limpo';
  if(c===2)  return 'Parcialmente nublado';
  if(c===3)  return 'Nublado';
  if(c<=48)  return 'Nevoeiro';
  if(c<=53)  return 'Garoa leve';
  if(c<=57)  return 'Garoa';
  if(c<=63)  return 'Chuva fraca';
  if(c<=65)  return 'Chuva';
  if(c<=67)  return 'Chuva forte';
  if(c<=77)  return 'Neve';
  if(c<=82)  return 'Pancadas de chuva';
  if(c<=86)  return 'Pancadas de neve';
  if(c<=95)  return 'Tempestade';
  return 'Tempestade com granizo';
}

// ── State ──────────────────────────────────────────────────────────
let curLat=null, curLon=null, curName='';

// ── API ────────────────────────────────────────────────────────────
const WX  = 'https://api.open-meteo.com/v1/forecast';
const GEO = 'https://geocoding-api.open-meteo.com/v1/search';
const REV = 'https://nominatim.openstreetmap.org/reverse';

async function fetchEcmwf(base){
  // ecmwf_ifs04 (0.4°) é o modelo antigo; tenta o IFS 0.25° e, se falhar, o IFS 9 km
  for(const m of ['ecmwf_ifs025','ecmwf_ifs']){
    try{
      const d=await fetch(`${base}&hourly=temperature_2m,precipitation&models=${m}`).then(r=>r.json());
      if(d&&!d.error&&d.hourly?.temperature_2m?.some(v=>v!=null)) return d;
    }catch(e){}
  }
  return null;
}

async function fetchWeather(lat,lon){
  const cur  = 'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weathercode,windspeed_10m,is_day';
  const hrly = 'temperature_2m,apparent_temperature,precipitation_probability,precipitation,weathercode,windspeed_10m,is_day';
  const dly  = 'weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,windspeed_10m_max';
  const base = `${WX}?latitude=${lat}&longitude=${lon}&timezone=auto&forecast_days=3`;

  const [main,ecmwf,gfs,icon] = await Promise.all([
    fetch(`${base}&current=${cur}&hourly=${hrly}&daily=${dly}`).then(r=>r.json()),
    fetchEcmwf(base),
    fetch(`${base}&hourly=temperature_2m,precipitation&models=gfs_seamless`).then(r=>r.json()).catch(()=>null),
    fetch(`${base}&hourly=temperature_2m,precipitation&models=icon_seamless`).then(r=>r.json()).catch(()=>null),
  ]);
  if(main.error) throw new Error(main.reason||'API error');
  return {main,ecmwf,gfs,icon};
}

async function reverseGeocode(lat,lon){
  try{
    const d = await fetch(`${REV}?lat=${lat}&lon=${lon}&format=json&accept-language=pt-BR`).then(r=>r.json());
    const a = d.address||{};
    const city = a.city||a.town||a.village||a.municipality||a.county||'';
    const state = a.state||'';
    return city+(state&&city?`, ${state}`:state);
  }catch{ return ''; }
}

async function searchCity(q){
  const d = await fetch(`${GEO}?name=${encodeURIComponent(q)}&count=6&language=pt&format=json`).then(r=>r.json());
  return d.results||[];
}

// ── Render current ─────────────────────────────────────────────────
function renderCurrent(data){
  const c = data.main.current||{};
  const code = c.weathercode??0, day = c.is_day??1;
  document.getElementById('cur-temp').textContent = Math.round(c.temperature_2m??0)+'°';
  document.getElementById('cur-icon').textContent = wmoIcon(code,day);
  document.getElementById('cur-desc').textContent = wmoDesc(code,day);
  document.getElementById('cur-chips').innerHTML = [
    {i:'🌡️',l:'Sensação',v:Math.round(c.apparent_temperature??0)+'°'},
    {i:'💧',l:'Umidade', v:(c.relative_humidity_2m??'--')+'%'},
    {i:'💨',l:'Vento',   v:Math.round(c.windspeed_10m??0)+' km/h'},
    {i:'🌧️',l:'Agora',   v:(+(c.precipitation||0)).toFixed(1)+' mm'},
  ].map(x=>`<div class="chip">${x.i} <b>${x.v}</b> ${x.l}</div>`).join('');
}

// ── Rain alert ─────────────────────────────────────────────────────
function renderAlert(data){
  const h = data.main.hourly, now = new Date();
  let maxPop=0, rainH=null;
  for(let i=0;i<h.time.length;i++){
    const dt = new Date(h.time[i]);
    const diff = (dt-now)/36e5;
    if(diff>=0&&diff<=6){
      const pop=h.precipitation_probability[i]??0, pr=h.precipitation[i]??0;
      if(pop>maxPop) maxPop=pop;
      if(pr>0.1&&rainH===null) rainH=Math.round(diff);
    }
  }
  const box = document.getElementById('alert-box');
  if(maxPop>=65||rainH!==null){
    const msg = rainH===0 ? `Chuva agora! (${maxPop}% de probabilidade)`
              : rainH!==null ? `Chuva prevista em ~${rainH}h (${maxPop}%)`
              : `Alta probabilidade de chuva nas próximas 6h (${maxPop}%)`;
    document.getElementById('alert-ico').textContent = maxPop>=80?'⛈️':'🌧️';
    document.getElementById('alert-txt').textContent = msg;
    box.hidden=false;
  } else {
    box.hidden=true;
  }
}

// ── Render hourly ──────────────────────────────────────────────────
function renderHourly(data){
  const h = data.main.hourly, now = new Date();
  let start = h.time.findIndex(t=>{
    const d=new Date(t);
    return d>=new Date(now.getFullYear(),now.getMonth(),now.getDate(),now.getHours());
  });
  if(start<0) start=0;
  const items=[];
  for(let i=start;i<Math.min(start+25,h.time.length);i++){
    const t=new Date(h.time[i]), isNow=i===start;
    const code=h.weathercode[i]??0, day=h.is_day[i]??1;
    const pop=h.precipitation_probability[i]??0;
    const prec=+(h.precipitation[i]||0);
    const temp=Math.round(h.temperature_2m[i]??0);
    const lbl=prec>0?prec.toFixed(1)+'mm':pop>=20?pop+'%':'';
    items.push(`<div class="h-item${isNow?' now':''}">
      <div class="h-time">${isNow?'Agora':t.getHours().toString().padStart(2,'0')+'h'}</div>
      <div class="h-ico">${wmoIcon(code,day)}</div>
      <div class="h-temp">${temp}°</div>
      <div class="h-pop${prec>0?' wet':''}">${lbl}</div>
    </div>`);
  }
  document.getElementById('h-strip').innerHTML=items.join('');
}

// ── Render daily ───────────────────────────────────────────────────
function renderDaily(data){
  const d=data.main.daily;
  document.getElementById('day-grid').innerHTML=d.time.slice(0,3).map((ds,i)=>{
    const date=new Date(ds+'T12:00:00');
    const name=i===0?'Hoje':i===1?'Amanhã':DAYS_PT[date.getDay()];
    const code=d.weathercode[i]??0;
    const max=Math.round(d.temperature_2m_max[i]??0);
    const min=Math.round(d.temperature_2m_min[i]??0);
    const pop=d.precipitation_probability_max[i]??0;
    const prec=+(d.precipitation_sum[i]||0);
    const rain=prec>=0.1?`🌧 ${prec.toFixed(0)}mm`:pop>20?`☔ ${pop}%`:'';
    return `<div class="day-card">
      <div class="day-name">${name}</div>
      <div class="day-ico">${wmoIcon(code,1)}</div>
      <div class="day-max">${max}°</div>
      <div class="day-min">${min}°</div>
      <div class="day-rain${!rain?' dry':''}">${rain||'Sem chuva'}</div>
    </div>`;
  }).join('');
}

// ── Consenso de modelos (tabelas) ──────────────────────────────────
const CN=48, CSTEP=3;
let _conData=null, _conTab='temp';

function switchConTab(tab){
  _conTab=tab;
  document.getElementById('tab-temp').classList.toggle('active',tab==='temp');
  document.getElementById('tab-rain').classList.toggle('active',tab==='rain');
  if(_conData) renderConsensus(_conData);
}
function renderConsensus(data){
  _conData=data;
  _conTab==='temp'?renderConsensusTemp(data):renderConsensusRain(data);
}

const pad2=n=>String(n).padStart(2,'0');
const MH='<th class="e">ECMWF</th><th class="g">GFS</th><th class="i">ICON</th>';
function conSeries(data,key){
  const g=m=>m?.hourly?.[key]?.slice(0,CN)||new Array(CN).fill(null);
  return [g(data.ecmwf),g(data.gfs),g(data.icon)];
}
function tbl(first,extra,rows){
  return `<div class="tbl-wrap"><table class="ctbl"><thead><tr><th>${first}</th>${MH}${extra}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function daySep(t,cols){
  const d=new Date(t);
  return `<tr class="dsep"><td colspan="${cols}">${DAYS_PT[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}</td></tr>`;
}

function renderConsensusTemp(data){
  const [E,G,I]=conSeries(data,'temperature_2m');
  const T=data.main.hourly.time.slice(0,CN);
  const out=document.getElementById('con-tbl'), info=document.getElementById('con-info');
  if(![...E,...G,...I].some(v=>v!=null)){
    out.innerHTML='<p class="con-empty">Dados indisponíveis</p>'; info.textContent=''; return;
  }
  let tot=0,cnt=0;
  for(let i=0;i<CN;i++){
    const vs=[E[i],G[i],I[i]].filter(v=>v!=null);
    if(vs.length>=2){ tot+=Math.max(...vs)-Math.min(...vs); cnt++; }
  }
  const avg=cnt?tot/cnt:0;
  info.textContent=
    avg<1?'🟢 Alta confiança — modelos em consenso (variação < 1°)':
    avg<3?'🟡 Confiança moderada — divergência de '+avg.toFixed(1)+'° em média':
    '🔴 Baixa confiança — modelos divergem '+avg.toFixed(1)+'° em média';

  const mm=(a,d)=>{
    const x=a.slice(d*24,d*24+24).filter(v=>v!=null);
    return x.length?Math.round(Math.min(...x))+'° / '+Math.round(Math.max(...x))+'°':'–';
  };
  const sum=[0,1].map(d=>`<tr><td>${d?'Amanhã':'Hoje'}</td><td>${mm(E,d)}</td><td>${mm(G,d)}</td><td>${mm(I,d)}</td></tr>`);

  const f=v=>v==null?'–':Math.round(v)+'°';
  const rows=[];
  for(let i=0;i<CN;i+=CSTEP){
    const t=new Date(T[i]);
    if(i===0||t.getHours()===0) rows.push(daySep(T[i],6));
    const vs=[E[i],G[i],I[i]].filter(v=>v!=null);
    const m=vs.length?vs.reduce((s,v)=>s+v,0)/vs.length:null;
    const sp=vs.length>1?Math.max(...vs)-Math.min(...vs):null;
    const cls=sp==null?'':sp<1?'ok':sp<3?'mid':'bad';
    rows.push(`<tr><td>${pad2(t.getHours())}h</td><td>${f(E[i])}</td><td>${f(G[i])}</td><td>${f(I[i])}</td><td><b>${f(m)}</b></td><td class="${cls}">${sp==null?'–':sp.toFixed(1)+'°'}</td></tr>`);
  }
  out.innerHTML=
    `<div class="tbl-ttl">Mín / Máx por dia</div>${tbl('Dia','',sum)}`+
    `<div class="tbl-ttl">A cada 3 horas · Δ = diferença entre modelos</div>${tbl('Hora','<th>Média</th><th>Δ</th>',rows)}`;
}

function renderConsensusRain(data){
  const [E,G,I]=conSeries(data,'precipitation');
  const T=data.main.hourly.time.slice(0,CN);
  const out=document.getElementById('con-tbl'), info=document.getElementById('con-info');
  if(![...E,...G,...I].some(v=>v!=null)){
    out.innerHTML='<p class="con-empty">Dados indisponíveis</p>'; info.textContent=''; return;
  }
  const sum=(a,s,e)=>{
    const x=a.slice(s,e).filter(v=>v!=null);
    return x.length?x.reduce((p,v)=>p+v,0):null;
  };
  const f=v=>v==null?'–':v<0.05?'0':v.toFixed(1);
  const wet=v=>v!=null&&v>=0.1?' class="wet"':'';
  info.textContent=`Acumulado 48h — ECMWF: ${f(sum(E,0,CN))}mm · GFS: ${f(sum(G,0,CN))}mm · ICON: ${f(sum(I,0,CN))}mm`;

  const dayRows=[0,1].map(d=>{
    const v=[E,G,I].map(a=>sum(a,d*24,d*24+24));
    return `<tr><td>${d?'Amanhã':'Hoje'}</td>${v.map(x=>`<td${wet(x)}>${f(x)}</td>`).join('')}</tr>`;
  });

  const rows=[]; let lastDay=-1;
  for(let i=0;i<CN;i+=CSTEP){
    const v=[E,G,I].map(a=>sum(a,i,i+CSTEP));
    if(!v.some(x=>x!=null&&x>=0.1)) continue;
    const t=new Date(T[i]), d=Math.floor(i/24);
    if(d!==lastDay){ rows.push(daySep(T[i],5)); lastDay=d; }
    const n=v.filter(x=>x!=null&&x>=0.1).length;
    rows.push(`<tr><td>${pad2(t.getHours())}–${pad2(t.getHours()+CSTEP-1)}h</td>${v.map(x=>`<td${wet(x)}>${f(x)}</td>`).join('')}<td class="${n===3?'ok':n===2?'mid':''}">${n}/3</td></tr>`);
  }
  out.innerHTML=
    `<div class="tbl-ttl">Total por dia (mm)</div>${tbl('Dia','',dayRows)}`+
    (rows.length
      ? `<div class="tbl-ttl">Blocos de 3h com chuva (mm) · Acordo = modelos com chuva</div>${tbl('Hora','<th>Acordo</th>',rows)}`
      : `<p class="con-empty">☀️ Sem chuva prevista nas próximas 48h pelos 3 modelos</p>`);
}

// ── Radar (RainViewer) ─────────────────────────────────────────────
let rMap=null,rMarker=null,rLayers=[],rFrames=[],rIdx=0,rTimer=null,rActiveLayer=null,rRadarHost='',rTileWarned=false,rCenterLat=0,rCenterLon=0;
const RADAR_NOTE='Radar: <a href="https://www.rainviewer.com/" target="_blank">RainViewer</a> · a cobertura varia por região. Para São Paulo, confira também o <a href="https://www.cgesp.org/" target="_blank">CGE</a> e o <a href="https://www.saisp.br/" target="_blank">SAISP</a>.';
function radarBounds(lat,lon,zoom){
  const world=256*Math.pow(2,zoom),half=256;
  const x=(lon+180)/360*world;
  const sin=Math.sin(lat*Math.PI/180);
  const y=(.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*world;
  const toLon=px=>px/world*360-180;
  const toLat=py=>Math.atan(Math.sinh(Math.PI*(1-2*py/world)))*180/Math.PI;
  return [[toLat(y+half),toLon(x-half)],[toLat(y-half),toLon(x+half)]];
}
function showRadarFrame(i){
  rIdx=i;
  if(rActiveLayer&&rMap.hasLayer(rActiveLayer)) rMap.removeLayer(rActiveLayer);
  if(!rLayers[i]){
    const f=rFrames[i];
    const url=`${rRadarHost}${f.path}/512/7/${rCenterLat.toFixed(4)}/${rCenterLon.toFixed(4)}/2/1_1.png`;
    const l=L.imageOverlay(url,radarBounds(rCenterLat,rCenterLon,7),{opacity:0.78,zIndex:5});
    l.on('error',()=>{ if(!rTileWarned){ rTileWarned=true; document.getElementById('radar-note').innerHTML='A imagem do radar não carregou. Aguarde alguns segundos e tente novamente. '+RADAR_NOTE; } });
    rLayers[i]=l;
  }
  rActiveLayer=rLayers[i].addTo(rMap);
  document.getElementById('radar-slider').value=i;
  const d=new Date(rFrames[i].time*1000);
  document.getElementById('radar-time').textContent=pad2(d.getHours())+':'+pad2(d.getMinutes())+(i===rFrames.length-1?' (agora)':'');
}
function radarPlay(on){
  clearInterval(rTimer); rTimer=null;
  document.getElementById('radar-play').textContent=on?'⏸':'▶';
  if(on) rTimer=setInterval(()=>showRadarFrame((rIdx+1)%rFrames.length),1400);
}
async function renderRadar(lat,lon){
  const note=document.getElementById('radar-note');
  note.innerHTML=RADAR_NOTE;
  rCenterLat=lat; rCenterLon=lon;
  try{
    if(!rMap){
      rMap=L.map('radar-map').setView([lat,lon],7);
      const dk=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
      L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dk?'dark_all':'light_all'}/{z}/{x}/{y}{r}.png`,{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(rMap);
      rMarker=L.circleMarker([lat,lon],{radius:6,color:'#fff',weight:2,fillColor:'#3b9eff',fillOpacity:1}).addTo(rMap);
      document.getElementById('radar-play').onclick=()=>radarPlay(!rTimer);
      document.getElementById('radar-slider').oninput=e=>{radarPlay(false);showRadarFrame(+e.target.value);};
    }else{
      rMap.setView([lat,lon],7); rMarker.setLatLng([lat,lon]);
    }
    setTimeout(()=>rMap.invalidateSize(),60);
    radarPlay(false);
    if(rActiveLayer&&rMap.hasLayer(rActiveLayer)) rMap.removeLayer(rActiveLayer);
    rActiveLayer=null; rLayers=[]; rTileWarned=false;
    const resp=await fetch('https://api.rainviewer.com/public/weather-maps.json');
    if(!resp.ok) throw new Error('erro '+resp.status+' em api.rainviewer.com');
    const j=await resp.json();
    rRadarHost=j.host;
    rFrames=(j.radar&&j.radar.past)||[];
    if(!rFrames.length) throw new Error('sem frames');
    const sl=document.getElementById('radar-slider');
    sl.max=rFrames.length-1;
    showRadarFrame(rFrames.length-1);
  }catch(e){
    console.error(e);
    note.innerHTML='Não foi possível carregar o radar ('+(e.message||e)+'). '+RADAR_NOTE;
  }
}

// ── Load ───────────────────────────────────────────────────────────
async function load(lat,lon,name){
  curLat=lat; curLon=lon;
  document.getElementById('loading').hidden=false;
  document.getElementById('content').hidden=true;
  document.getElementById('err-msg').hidden=true;
  try{
    if(name){ curName=name; }
    else {
      document.getElementById('loc-name').textContent='Localizando…';
      curName=await reverseGeocode(lat,lon)||`${lat.toFixed(2)}, ${lon.toFixed(2)}`;
    }
    document.getElementById('loc-name').textContent=curName;
    const now=new Date();
    document.getElementById('loc-sub').textContent=
      DAYS_PT[now.getDay()]+', '+now.getDate()+' de '+MONTHS_PT[now.getMonth()]+' · '+
      now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');

    const data=await fetchWeather(lat,lon);
    renderCurrent(data);
    renderAlert(data);
    renderHourly(data);
    renderDaily(data);
    renderConsensus(data);

    document.getElementById('ft-updated').textContent=
      'Atualizado às '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
    document.getElementById('loading').hidden=true;
    document.getElementById('content').hidden=false;
    renderRadar(lat,lon);
  }catch(e){
    console.error(e);
    document.getElementById('loading').hidden=true;
    document.getElementById('err-msg').hidden=false;
    document.getElementById('err-txt').textContent='Não foi possível carregar a previsão. Verifique sua conexão.';
  }
}

function retryLoad(){ if(curLat) load(curLat,curLon,curName); }

// ── Geolocation ────────────────────────────────────────────────────
function useGPS(){
  document.getElementById('loc-name').textContent='Obtendo localização…';
  if(!navigator.geolocation){ load(-23.5505,-46.6333,'São Paulo, SP'); return; }
  navigator.geolocation.getCurrentPosition(
    p=>load(p.coords.latitude,p.coords.longitude),
    ()=>load(-23.5505,-46.6333,'São Paulo, SP'),
    {timeout:8000}
  );
}

// ── Search ─────────────────────────────────────────────────────────
document.getElementById('btn-srch').onclick=()=>{
  document.getElementById('search-ov').hidden=false;
  setTimeout(()=>document.getElementById('srch-inp').focus(),80);
};
document.getElementById('btn-srch-cancel').onclick=closeSearch;
document.getElementById('btn-gps').onclick=useGPS;

function closeSearch(){
  document.getElementById('search-ov').hidden=true;
  document.getElementById('srch-inp').value='';
  document.getElementById('srch-results').innerHTML='';
}

let srchT;
document.getElementById('srch-inp').oninput=e=>{
  clearTimeout(srchT);
  const q=e.target.value.trim();
  if(q.length<2){document.getElementById('srch-results').innerHTML='';return;}
  srchT=setTimeout(async()=>{
    try{
      const res=await searchCity(q);
      document.getElementById('srch-results').innerHTML=res.length
        ? res.map(r=>{
            const sub=[r.admin1,r.country].filter(Boolean).join(', ');
            const safeName=(r.name+(r.admin1?', '+r.admin1:'')).replace(/'/g,"\\'");
            return `<div class="sr-item" onclick="pick(${r.latitude},${r.longitude},'${safeName}')">
              <div class="sr-name">${r.name}</div>
              <div class="sr-sub">${sub}</div>
            </div>`;
          }).join('')
        : '<p style="padding:12px;color:var(--dim);font-size:13px">Nenhum resultado encontrado</p>';
    }catch{
      document.getElementById('srch-results').innerHTML='<p style="padding:12px;color:var(--dim);font-size:13px">Erro ao buscar. Verifique sua conexão.</p>';
    }
  },350);
};

function pick(lat,lon,name){
  closeSearch();
  load(lat,lon,name);
}

// ── Init ───────────────────────────────────────────────────────────
useGPS();
</script>
